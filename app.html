<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SnipeStudio | AI Resell Engine</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SnipeStudio">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0B0F19">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    },
                    colors: {
                        slateDark: '#0B0F19',
                        cardSlate: '#1E293B',
                        borderSlate: '#334155',
                        indigoBrand: '#6366F1',
                        emeraldBrand: '#10B981',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0B0F19;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .snippet-gradient {
            background: linear-gradient(135deg, #FFFFFF 20%, #818CF8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-snippet {
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(99, 102, 241, 0.15);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-100 min-h-screen pb-28 select-none">

    <!-- HEADER SNIPESTUDIO -->
    <header class="sticky top-0 z-40 glass-snippet px-5 py-3 pt-11">
        <div class="flex items-center justify-between mb-3">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-indigo-600 p-[1px] shadow-lg shadow-indigo-500/20">
                    <div class="w-full h-full bg-slateDark rounded-xl flex items-center justify-center">
                        <i class="fa-solid fa-bullseye text-indigo-400 text-xs"></i>
                    </div>
                </div>
                <div>
                    <h1 class="font-serif italic font-bold text-base leading-none tracking-wider snippet-gradient">SnipeStudio</h1>
                    <span class="text-[7px] font-extrabold tracking-[0.25em] text-indigo-400 uppercase">AI Resell Engine</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <div class="bg-cardSlate border border-borderSlate px-3 py-1 rounded-full flex items-center space-x-2 shadow-inner">
                    <span class="w-1.5 h-1.5 rounded-full bg-emeraldBrand animate-ping"></span>
                    <span class="text-[10px] font-bold tracking-wider text-slate-300 uppercase" id="stat-count">0 Pépites</span>
                </div>
                <button onclick="chargerAnnonces()" class="w-8 h-8 rounded-xl bg-cardSlate border border-borderSlate flex items-center justify-center text-slate-300 active:scale-95 transition shadow-sm">
                    <i class="fa-solid fa-arrows-rotate text-[11px]" id="refresh-icon"></i>
                </button>
            </div>
        </div>

        <div class="relative mb-3">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-xs"></i>
            <input type="text" id="search-input" oninput="filtrerParRecherche()" placeholder="Rechercher une pépite, marque, sneakers..." class="w-full bg-cardSlate border border-borderSlate rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition shadow-inner">
        </div>

        <div class="flex space-x-2 overflow-x-auto no-scrollbar pt-1 pb-1">
            <button onclick="filtrerMarque('TOUS')" id="btn-tous" class="px-3.5 py-1.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-indigo-600 text-white transition shrink-0 shadow-md shadow-indigo-600/30">Tous</button>
            <button onclick="filtrerMarque('Sneakers')" id="btn-sneakers" class="px-3.5 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-cardSlate text-slate-400 border border-borderSlate transition shrink-0">👟 Sneakers</button>
            <button onclick="filtrerMarque('Ralph Lauren')" id="btn-ralph" class="px-3.5 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-cardSlate text-slate-400 border border-borderSlate transition shrink-0">Ralph Lauren</button>
            <button onclick="filtrerMarque('Carhartt')" id="btn-carhartt" class="px-3.5 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-cardSlate text-slate-400 border border-borderSlate transition shrink-0">Carhartt</button>
            <button onclick="filtrerMarque('Techwear')" id="btn-techwear" class="px-3.5 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-cardSlate text-slate-400 border border-borderSlate transition shrink-0">Techwear</button>
            <button onclick="filtrerMarque('Streetwear')" id="btn-streetwear" class="px-3.5 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-cardSlate text-slate-400 border border-borderSlate transition shrink-0">Streetwear</button>
        </div>
    </header>

    <!-- MAIN FEED -->
    <main class="p-4 max-w-md mx-auto">
        <div class="flex items-center justify-between mb-4 px-1">
            <span class="text-[10px] font-extrabold uppercase tracking-[0.2em] text-slate-400">Flux En Direct</span>
            <select id="tri-select" onchange="triAnnonces()" class="bg-cardSlate border border-borderSlate text-slate-300 text-[10px] rounded-lg px-2.5 py-1.5 font-bold focus:outline-none focus:border-indigo-500">
                <option value="recent">Plus Récent</option>
                <option value="benefice">Bénéfice Max</option>
                <option value="prix_asc">Prix Croissant</option>
            </select>
        </div>

        <div id="loading-state" class="grid grid-cols-2 gap-3">
            <div class="bg-cardSlate rounded-2xl h-72 animate-pulse border border-borderSlate/50"></div>
            <div class="bg-cardSlate rounded-2xl h-72 animate-pulse border border-borderSlate/50"></div>
            <div class="bg-cardSlate rounded-2xl h-72 animate-pulse border border-borderSlate/50"></div>
            <div class="bg-cardSlate rounded-2xl h-72 animate-pulse border border-borderSlate/50"></div>
        </div>

        <div id="annonces-container" class="grid grid-cols-2 gap-3.5 hidden">
            <!-- Injecté via JS -->
        </div>
    </main>

    <!-- POPUP MODAL SHOWROOM & STUDIO PHOTO -->
    <div id="product-modal" class="fixed inset-0 z-50 bg-slateDark/95 backdrop-blur-xl hidden flex-col justify-end transition-all duration-300">
        <div id="modal-content-box" class="bg-cardSlate border-t border-borderSlate rounded-t-[36px] max-h-[88vh] overflow-y-auto p-6 transform translate-y-full transition-transform duration-300 ease-out shadow-2xl pb-12">
            
            <div class="w-10 h-1 bg-borderSlate rounded-full mx-auto mb-5"></div>
            
            <div class="relative rounded-2xl overflow-hidden mb-4 bg-slateDark aspect-square border border-borderSlate shadow-xl">
                <img id="modal-img" src="" referrerpolicy="no-referrer" alt="Produit SnipeStudio" class="w-full h-full object-cover">
                <span id="modal-condition-badge" class="absolute bottom-3 left-3 bg-slateDark/90 backdrop-blur-md text-indigo-300 text-[10px] font-black px-2.5 py-1 rounded-lg border border-indigo-500/30">
                    <i class="fa-solid fa-sparkles text-indigo-400 mr-1"></i> Condition <span id="modal-cond-val">9.5/10</span>
                </span>
            </div>

            <!-- GALERIE STUDIO 4 POSES -->
            <div class="mb-5">
                <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-2"><i class="fa-solid fa-camera-retro mr-1 text-indigo-400"></i> Studio Photo 4 Poses Revente</span>
                <div class="grid grid-cols-4 gap-2" id="studio-poses-box">
                    <!-- Injecté par JS -->
                </div>
            </div>

            <div class="flex items-center justify-between mb-2">
                <span id="modal-cat" class="text-[10px] font-black text-indigo-400 uppercase tracking-[0.25em]"></span>
                <div class="flex items-center space-x-1 text-slate-200 text-xs font-bold bg-slateDark px-2.5 py-1 rounded-lg border border-borderSlate">
                    <i class="fa-solid fa-shield-check text-[10px] text-emerald-400"></i>
                    <span>IA Verified</span>
                </div>
            </div>

            <h3 id="modal-title" class="text-sm font-bold text-white mb-4 leading-snug"></h3>

            <div class="grid grid-cols-3 gap-2 bg-slateDark p-3.5 rounded-2xl border border-borderSlate mb-4 text-center shadow-inner">
                <div>
                    <span class="block text-[8px] text-slate-400 font-bold uppercase tracking-wider">Prix Affiché</span>
                    <span id="modal-prix" class="text-xs font-bold text-white mt-1 block"></span>
                </div>
                <div class="border-x border-borderSlate">
                    <span class="block text-[8px] text-slate-400 font-bold uppercase tracking-wider">Revente Est.</span>
                    <span id="modal-revente" class="text-xs font-bold text-slate-300 mt-1 block"></span>
                </div>
                <div>
                    <span class="block text-[8px] text-slate-400 font-bold uppercase tracking-wider">Marge Nette</span>
                    <span id="modal-benefice" class="text-xs font-black text-emeraldBrand mt-1 block"></span>
                </div>
            </div>

            <!-- MODULE ASSISTANT NÉGOCIATION -->
            <div class="bg-indigo-950/40 border border-indigo-500/20 p-4 rounded-2xl mb-5">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[10px] font-bold text-indigo-300 uppercase tracking-wider"><i class="fa-solid fa-comments-dollar mr-1"></i> Offre Négociée Conseillée</span>
                    <span id="modal-offre-nego" class="text-xs font-extrabold text-emerald-400">12.0 €</span>
                </div>
                <p id="modal-msg-text" class="text-[10px] text-slate-300 italic mb-3 bg-slateDark/60 p-2.5 rounded-xl border border-borderSlate/40"></p>
                <button onclick="copierMsgNego()" id="btn-copy-msg" class="w-full py-2 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-200 text-[10px] font-bold rounded-xl border border-indigo-500/40 transition flex items-center justify-center space-x-1.5">
                    <i class="fa-regular fa-copy"></i>
                    <span>Copier le message de négociation</span>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="ouvrirLienVinted()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-[11px] uppercase tracking-widest rounded-2xl flex items-center justify-center space-x-2 shadow-lg shadow-indigo-600/30 active:scale-95 transition">
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                    <span>Acheter Vinted</span>
                </button>
                <button onclick="fermerModal()" class="w-full py-4 bg-slateDark text-slate-300 font-bold text-[11px] uppercase tracking-widest rounded-2xl border border-borderSlate active:scale-95 transition">
                    Fermer
                </button>
            </div>
        </div>
    </div>

    <script>
        const FALLBACK_IMG = 'https://images.unsplash.com/photo-1523381210434-271e8be1f52b?auto=format&fit=crop&w=600&q=80';
        let lienVintedActuel = "";
        let msgNegoActuel = "";
        let listeArticlesGlobale = [];
        let marqueActive = 'TOUS';

        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            window.Telegram.WebApp.setHeaderColor('#0B0F19');
        }

        function ouvrirLienVinted() {
            if (!lienVintedActuel) return;
            if (window.Telegram && window.Telegram.WebApp && typeof window.Telegram.WebApp.openLink === 'function') {
                window.Telegram.WebApp.openLink(lienVintedActuel, { try_instant_view: false });
            } else {
                window.open(lienVintedActuel, '_blank');
            }
        }

        function copierMsgNego() {
            if (!msgNegoActuel) return;
            navigator.clipboard.writeText(msgNegoActuel).then(() => {
                const btn = document.getElementById('btn-copy-msg');
                btn.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i> Copié !';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copier le message de négociation';
                }, 2000);
            });
        }

        async function chargerAnnonces() {
            const container = document.getElementById('annonces-container');
            const loading = document.getElementById('loading-state');
            const icon = document.getElementById('refresh-icon');

            if (icon) icon.classList.add('fa-spin');

            try {
                const response = await fetch('/api/annonces');
                listeArticlesGlobale = await response.json();

                document.getElementById('stat-count').innerText = `${listeArticlesGlobale.length} Pépites`;
                afficherArticles();

                if (loading) loading.classList.add('hidden');
                if (container) container.classList.remove('hidden');

            } catch (err) {
                console.error("Erreur auto-sync :", err);
            } finally {
                if (icon) setTimeout(() => icon.classList.remove('fa-spin'), 500);
            }
        }

        function filtrerMarque(marque) {
            marqueActive = marque;
            ['tous', 'sneakers', 'ralph', 'carhartt', 'techwear', 'streetwear'].forEach(id => {
                const btn = document.getElementById(`btn-${id}`);
                if (btn) btn.className = "px-3.5 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-cardSlate text-slate-400 border border-borderSlate transition shrink-0";
            });

            const activeBtnId = marque === 'TOUS' ? 'btn-tous' : 
                                marque === 'Sneakers' ? 'btn-sneakers' : 
                                marque === 'Ralph Lauren' ? 'btn-ralph' : 
                                marque === 'Carhartt' ? 'btn-carhartt' : 
                                marque === 'Techwear' ? 'btn-techwear' : 'btn-streetwear';
            
            const activeBtn = document.getElementById(activeBtnId);
            if (activeBtn) activeBtn.className = "px-3.5 py-1.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-indigo-600 text-white transition shrink-0 shadow-md shadow-indigo-600/30";

            afficherArticles();
        }

        function filtrerParRecherche() { afficherArticles(); }

        function triAnnonces() {
            const mode = document.getElementById('tri-select').value;
            if (mode === 'benefice') {
                listeArticlesGlobale.sort((a, b) => b.benefice - a.benefice);
            } else if (mode === 'prix_asc') {
                listeArticlesGlobale.sort((a, b) => a.prix - b.prix);
            } else {
                listeArticlesGlobale.sort((a, b) => b.id - a.id);
            }
            afficherArticles();
        }

        function afficherArticles() {
            const container = document.getElementById('annonces-container');
            const rechercheText = document.getElementById('search-input').value.toLowerCase();
            container.innerHTML = '';

            let articlesFiltres = listeArticlesGlobale;

            if (marqueActive !== 'TOUS') {
                articlesFiltres = articlesFiltres.filter(art => art.type_article.toLowerCase().includes(marqueActive.toLowerCase()));
            }

            if (rechercheText.trim() !== '') {
                articlesFiltres = articlesFiltres.filter(art => art.titre.toLowerCase().includes(rechercheText));
            }

            if (articlesFiltres.length === 0) {
                container.innerHTML = `
                    <div class="col-span-2 text-center py-24 text-slate-500">
                        <i class="fa-solid fa-bullseye text-2xl text-slate-600 mb-3 block"></i>
                        <p class="text-[11px] font-medium tracking-wider uppercase">Aucune pépite trouvée...</p>
                    </div>
                `;
                return;
            }

            articlesFiltres.forEach(art => {
                const card = document.createElement('div');
                card.className = "bg-cardSlate rounded-2xl border border-borderSlate/60 overflow-hidden flex flex-col justify-between active:scale-[0.97] transition duration-200 cursor-pointer shadow-xl relative group hover:border-indigo-500/50";
                card.onclick = () => ouvrirModal(art);

                card.innerHTML = `
                    <div class="relative aspect-square bg-slateDark overflow-hidden">
                        <img src="${art.image}" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='${FALLBACK_IMG}';" alt="${art.titre}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        <span class="absolute top-2 left-2 bg-slateDark/90 backdrop-blur-md text-emeraldBrand text-[9px] font-black px-2 py-0.5 rounded-lg border border-borderSlate shadow-sm">
                            +${art.benefice} €
                        </span>
                        <span class="absolute bottom-2 right-2 bg-indigo-950/80 backdrop-blur-md text-indigo-300 text-[8px] font-bold px-1.5 py-0.5 rounded border border-indigo-500/30">
                            ⭐ ${art.condition || '9.0/10'}
                        </span>
                    </div>
                    <div class="p-3.5 flex flex-col justify-between flex-1">
                        <h4 class="text-[11px] font-medium text-slate-200 line-clamp-2 leading-tight mb-3">${art.titre}</h4>
                        <div class="flex items-center justify-between pt-2 border-t border-borderSlate/60">
                            <span class="text-xs font-extrabold text-white">${art.prix} €</span>
                            <span class="text-[9px] font-bold text-emerald-400">
                                📈 ${art.revente} €
                            </span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function ouvrirModal(article) {
            lienVintedActuel = article.lien || "https://www.vinted.fr";
            msgNegoActuel = article.msg_nego || "";
            
            const modalImg = document.getElementById('modal-img');
            modalImg.src = article.image;
            modalImg.onerror = function() {
                this.onerror = null;
                this.src = FALLBACK_IMG;
            };

            // Remplissage des 4 poses studio
            const posesContainer = document.getElementById('studio-poses-box');
            posesContainer.innerHTML = '';
            const poses = article.studio_poses || [
                {pose: "Face", url: article.image},
                {pose: "Profil", url: article.image},
                {pose: "Zoom", url: article.image},
                {pose: "Studio", url: article.image}
            ];

            poses.forEach(p => {
                const imgDiv = document.createElement('div');
                imgDiv.className = "relative aspect-square rounded-xl overflow-hidden border border-borderSlate bg-slateDark cursor-pointer";
                imgDiv.onclick = () => { modalImg.src = p.url; };
                imgDiv.innerHTML = `
                    <img src="${p.url}" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='${FALLBACK_IMG}';" class="w-full h-full object-cover">
                    <span class="absolute bottom-1 left-1 right-1 text-[7px] bg-slateDark/80 text-center text-slate-300 rounded font-bold uppercase truncate">${p.pose}</span>
                `;
                posesContainer.appendChild(imgDiv);
            });

            document.getElementById('modal-cat').innerText = article.type_article || 'SNIPESTUDIO SELECTION';
            document.getElementById('modal-title').innerText = article.titre;
            document.getElementById('modal-prix').innerText = `${article.prix} €`;
            document.getElementById('modal-revente').innerText = `${article.revente} €`;
            document.getElementById('modal-benefice').innerText = `+${article.benefice} €`;
            document.getElementById('modal-cond-val').innerText = article.condition || '9.0/10';
            document.getElementById('modal-offre-nego').innerText = `${article.offre_nego || Math.round(article.prix * 0.85)} €`;
            document.getElementById('modal-msg-text').innerText = `"${msgNegoActuel}"`;

            const modal = document.getElementById('product-modal');
            const box = document.getElementById('modal-content-box');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => box.classList.remove('translate-y-full'), 10);
        }

        function fermerModal() {
            const modal = document.getElementById('product-modal');
            const box = document.getElementById('modal-content-box');
            box.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 300);
        }

        document.addEventListener('DOMContentLoaded', () => {
            chargerAnnonces();
            setInterval(chargerAnnonces, 60000);
        });
    </script>
</body>
</html>
